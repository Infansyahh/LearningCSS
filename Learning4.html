<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    font-family: 'Times New Roman', Times, serif;
 }

 form {
    width: 500px;
    border: 1px solid teal;
    margin: 200px auto;
    padding: 20px;
    border-radius: 5px;     
 }

 input {
    width: 100%;
    margin-top: 10px;
    box-sizing: border-box;
    border: none;
    padding: 5px;
    border-bottom: 1px solid teal;
    outline: none;
 }

 button {
    width: 100%;
    padding: 5px;
    border: 1px solid teal;
    background-color: teal;
    color: white;
    margin-top: 10px;
    margin-bottom: 10px;
 }

</style>
<body>
    <form action="">
    <h3>LOGIN</h3>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button type="submit">Login</button>
    <p>Belum punya akun? <a href="Learning5.html">Sign Up</a></p>
    </form>
</body>
</html>
