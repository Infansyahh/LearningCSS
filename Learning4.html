<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
   * {
    margin: 0;
    padding: 0;
    font-family: 'Times New Roman', Times, serif;
   }

   body {
    background-image: url(../LearningCSS/image/cat2.png);
    background-size: cover;
   }

   h3 {
    margin-bottom: 10px;
    text-align: center;
   }

   form {
    width: 300px;
    border: 1px solid rgb(58, 59, 59);
    margin: 235px auto;
    padding: 20px;
    border-radius: 5px;
    background-color: beige;
   }

   input {
    display: block;
    width: 100%;
    height: 28px;
    margin-bottom: 10px;
    padding: 5px;
    border: none;
    box-sizing: border-box;
   }

   button {
    width: 100%;
    height: 30px;
    padding: 5px;
    border: none;
    border-radius: 3px;
    background-color: rgb(233, 255, 110);
    box-shadow: 0px 2px 2px gray;
   }

</style>
<body>
    <form action="">
    <h3>LOGIN</h3>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button type="submit">Login</button>
    </form>
</body>
</html>
